<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบทวนสอบย้อนกลับไก่เนื้อ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#1B2421; --ink-soft:#4B5650; --paper:#F6F5F0; --card:#FFFFFF; --line:#DEDCD2;
    --teal-900:#04342C; --teal-700:#0F6E56; --teal-500:#1D9E75; --teal-100:#E1F5EE;
    --amber-700:#854F0B; --amber-500:#BA7517; --amber-100:#FAEEDA;
    --gray-500:#888780; --gray-100:#F1EFE8;
    --red-600:#A32D2D; --red-100:#FCEBEB; --green-700:#27500A; --green-100:#EAF3DE;
    --purple-700:#4A3F9E; --purple-100:#EBE8FB;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Sarabun',sans-serif;background:var(--paper);color:var(--ink);}
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--teal-900),#08221D);}
  .login-card{background:var(--card);border-radius:16px;padding:44px 40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-eyebrow{font-size:12px;letter-spacing:.08em;color:var(--teal-500);font-weight:600;text-transform:uppercase;}
  .login-title{font-size:24px;font-weight:700;margin:6px 0 4px;}
  .login-sub{font-size:14px;color:var(--ink-soft);margin-bottom:26px;line-height:1.6;}
  .login-error{font-size:13px;color:var(--red-600);margin:-8px 0 14px;min-height:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-soft);}
  select, input[type=text], input[type=number], input[type=date], input[type=password]{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font-family:'Sarabun',sans-serif;font-size:14px;background:#fff;color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--teal-500);outline-offset:1px;border-color:var(--teal-500);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--teal-700);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-family:'Sarabun',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s;}
  .btn:hover{background:var(--teal-900);}
  .btn:disabled{background:var(--gray-500);cursor:not-allowed;}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--gray-100);color:var(--ink);}
  .btn-sm{padding:7px 12px;font-size:13px;}
  #appScreen{display:none;min-height:100vh;}
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:260px;flex-shrink:0;background:var(--teal-900);color:#EDEEE8;padding:22px 14px;display:flex;flex-direction:column;overflow-y:auto;}
  .brand{padding:0 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:6px;}
  .brand-name{font-weight:700;font-size:15px;}
  .brand-sub{font-size:11px;color:#8FBBB0;margin-top:2px;}
  .nav-group-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7FA79C;padding:14px 10px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;color:#D6E4DF;margin-bottom:2px;}
  .nav-item:hover{background:rgba(255,255,255,.08);}
  .nav-item.active{background:#0F6E56;color:#fff;font-weight:600;}
  .nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--teal-500);}
  .nav-dot.ccp{background:var(--amber-500);}
  .nav-dot.phase2{background:var(--gray-500);}
  .nav-dot.util{background:#7F77DD;}
  .nav-dot.fg{background:#C24DA0;}
  .nav-dot.admin{background:#E05A5A;}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);}
  .role-chip{font-size:12px;color:#B9CFC8;margin-bottom:2px;}
  .role-chip b{color:#fff;}
  .user-chip{font-size:11px;color:#8FBBB0;margin-bottom:8px;}
  .main{flex:1;padding:30px 40px;max-width:1100px;}
  .page-eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-700);}
  .page-title{font-size:24px;font-weight:700;margin:4px 0 4px;}
  .page-desc{font-size:14px;color:var(--ink-soft);margin-bottom:22px;max-width:680px;line-height:1.6;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;}
  .card-title{font-size:15px;font-weight:700;margin-bottom:14px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .form-grid .field.full{grid-column:1/-1;}
  .ccp-field label{color:var(--amber-700);}
  .ccp-field input,.ccp-field select{border-color:var(--amber-500);}
  .source-box{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;background:var(--gray-100);max-height:220px;overflow-y:auto;}
  .source-box .empty{font-size:13px;color:var(--ink-soft);}
  .source-item{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-weight:600;color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .lotcode{font-weight:700;color:var(--teal-900);cursor:pointer;}
  .lotcode.fg{color:var(--purple-700);}
  .lotsub{font-size:11.5px;color:var(--ink-soft);font-family:monospace;}
  .badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;margin:1px 3px 1px 0;}
  .badge-pass{background:var(--green-100);color:var(--green-700);}
  .badge-fail{background:var(--red-100);color:var(--red-600);}
  .badge-ccp{background:var(--amber-100);color:var(--amber-700);}
  .badge-fg{background:var(--purple-100);color:var(--purple-700);}
  .src-tag{display:inline-block;font-size:12px;background:var(--teal-100);color:var(--teal-700);padding:2px 7px;border-radius:6px;margin:1px 3px 1px 0;cursor:pointer;}
  .src-tag.fg{background:var(--purple-100);color:var(--purple-700);}
  .empty-state{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .grid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:border-color .15s, transform .1s;}
  .stat-card:hover{border-color:var(--teal-500);transform:translateY(-1px);}
  .stat-card .num{font-size:26px;font-weight:700;color:var(--teal-900);}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .stat-card .tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;}
  .trace-search{display:flex;gap:10px;margin-bottom:20px;}
  .trace-search input{flex:1;}
  .trace-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .trace-col h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:0 0 10px;}
  .trace-node{border-left:3px solid var(--teal-500);background:var(--card);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .trace-node.self{border-left-color:var(--amber-500);background:var(--amber-100);}
  .trace-node.fg{border-left-color:var(--purple-700);}
  .trace-node .st{font-size:11.5px;color:var(--ink-soft);}
  .trace-node .code{font-weight:700;font-size:14px;}
  .note-banner{background:var(--teal-100);color:var(--teal-900);border-radius:8px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;}
  .warn-banner{background:var(--amber-100);color:var(--amber-700);border-radius:8px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;}
  .err-banner{background:var(--red-100);color:var(--red-600);border-radius:8px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;}
  .phase2-banner{background:var(--gray-100);color:var(--ink-soft);border-radius:8px;padding:30px;text-align:center;font-size:14px;}
  .lotpill{display:inline-flex;flex-direction:column;font-family:monospace;background:var(--teal-100);color:var(--teal-900);border-radius:6px;padding:6px 10px;font-size:12.5px;}
  details.docbox{margin:0;}
  details.docbox summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--teal-700);list-style:none;display:flex;align-items:center;gap:5px;}
  details.docbox summary::before{content:'▸';font-size:10px;}
  details.docbox[open] summary::before{content:'▾';}
  details.docbox summary::-webkit-details-marker{display:none;}
  .doclist{max-height:260px;overflow-y:auto;margin-top:8px;min-width:280px;border:1px solid var(--line);border-radius:8px;background:var(--gray-100);}
  .doc-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .doc-item:last-child{border-bottom:none;}
  .doc-name{font-weight:600;color:var(--ink);display:block;}
  .doc-meta{color:var(--ink-soft);font-size:11px;display:block;margin-top:1px;}
  .doc-meta .badge{margin:1px 3px 0 0;font-size:10px;padding:1px 6px;}
  details.station-acc{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--card);overflow:hidden;}
  details.station-acc summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;background:var(--gray-100);}
  details.station-acc summary::-webkit-details-marker{display:none;}
  details.station-acc summary::before{content:'▸';font-size:11px;color:var(--ink-soft);}
  details.station-acc[open] summary::before{content:'▾';}
  .acc-count{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-soft);}
  .acc-body{padding:14px 16px;}
  .existing-rec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--paper);}
  .existing-rec .st{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .existing-rec .kv{display:inline-block;font-size:12.5px;margin:1px 10px 1px 0;}
  .readonly-banner{background:var(--purple-100);color:var(--purple-700);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
  .flow-connector{height:22px;width:2px;background:var(--line);margin:0 0 0 24px;position:relative;}
  .flow-connector::after{content:'▾';position:absolute;left:-7px;top:10px;font-size:12px;color:var(--ink-soft);}
  .flow-branch{margin:6px 0 16px 40px;padding:14px 16px;border-left:3px dashed var(--purple-700);background:var(--purple-100);border-radius:0 8px 8px 0;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-eyebrow">Traceability System</div>
    <div class="login-title">เข้าสู่ระบบ</div>
    <div class="login-sub">ระบบทวนสอบย้อนกลับผลิตภัณฑ์ไก่เนื้อ — เชื่อมต่อ Supabase จริง</div>
    <div class="field"><label for="loginCode">รหัสพนักงาน</label><input type="text" id="loginCode" placeholder="เช่น QC1032" autocomplete="username"></div>
    <div class="field"><label for="loginPin">PIN</label><input type="password" id="loginPin" placeholder="รหัส PIN" autocomplete="current-password"></div>
    <div class="login-error" id="loginError"></div>
    <button class="btn btn-block" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<div id="pinChangeScreen" style="display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--teal-900),#08221D);">
  <div class="login-card">
    <div class="login-eyebrow">ครั้งแรกที่เข้าใช้งาน</div>
    <div class="login-title">ตั้ง PIN ใหม่ของคุณ</div>
    <div class="login-sub">บัญชีนี้ยังใช้ PIN เริ่มต้น (12345678) อยู่ — กรุณาตั้ง PIN ใหม่ของตัวเองก่อนใช้งานระบบ ห้ามใช้ 12345678 ซ้ำ</div>
    <div class="field"><label for="newPin1">PIN ใหม่ (อย่างน้อย 4 หลัก)</label><input type="password" id="newPin1" autocomplete="new-password"></div>
    <div class="field"><label for="newPin2">ยืนยัน PIN ใหม่</label><input type="password" id="newPin2" autocomplete="new-password"></div>
    <div class="login-error" id="pinChangeError"></div>
    <button class="btn btn-block" id="pinChangeBtn" onclick="submitFirstPinChange()">ตั้ง PIN ใหม่และเข้าสู่ระบบ</button>
  </div>
</div>

<div id="appScreen">
  <div class="app-shell">
    <div class="sidebar">
      <div class="brand"><div class="brand-name">Traceability System</div><div class="brand-sub">ระบบทวนสอบย้อนกลับไก่เนื้อ</div></div>
      <div id="navContainer"></div>
      <div class="sidebar-footer">
        <div class="role-chip">บทบาท: <b id="roleDisplay"></b></div>
        <div class="user-chip" id="userNameDisplay"></div>
        <button class="btn btn-ghost btn-sm" style="color:#EDEEE8;border-color:rgba(255,255,255,.25);width:100%;margin-bottom:6px;" onclick="openChangePinDialog()">เปลี่ยน PIN</button>
        <button class="btn btn-ghost btn-sm" style="color:#EDEEE8;border-color:rgba(255,255,255,.25);width:100%;" onclick="doLogout()">ออกจากระบบ</button>
      </div>
    </div>
    <div class="main" id="mainContent"></div>
  </div>
</div>

<script>
/* ================= SUPABASE CONNECTION ================= */
const SUPABASE_URL = 'https://ppyumdyuiltqmdpkccmo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBweXVtZHl1aWx0cW1kcGtjY21vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNzE2NTAsImV4cCI6MjEwMjg0NzY1MH0.pBMU330OjxZyjFMwcnbKLeTapD24NlpWSz4XqTJUTHE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null; // {token, employee_id, full_name, role}
const ROLE_LABEL = {ADMIN:'Admin (ผู้ดูแลระบบ)', AUDITOR:'Auditor (อ่านอย่างเดียว)', QA:'QA / Manager', QC:'QC / PRD'};

/* ================= GOOGLE DRIVE (สำหรับอัปโหลดรูปแทนการเก็บใน Supabase Storage) ================= */
// TODO: ใส่ค่าจริงจาก Google Cloud Console (ดูขั้นตอนที่แนบให้)
const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com';
const DRIVE_FOLDER_ID = 'YOUR_SHARED_DRIVE_FOLDER_ID';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
// เมื่ออัปโหลดเสร็จ ตั้งสิทธิ์เปิดดูให้ "ใครมีลิงก์ก็ดูได้" (anyone) — ถ้ามี Google Workspace ของบริษัท
// แนะนำเปลี่ยนเป็น {type:'domain', domain:'yourcompany.com'} แทน จะปลอดภัยกว่า (จำกัดเฉพาะคนในบริษัท)
const DRIVE_SHARE_PERMISSION = {role:'reader', type:'anyone'};

let gDriveAccessToken = null;
let gTokenClient = null;
function ensureGoogleTokenClient(){
  if(gTokenClient) return gTokenClient;
  gTokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE, callback: '' });
  return gTokenClient;
}
function getDriveAccessToken(forceConsent){
  return new Promise((resolve, reject)=>{
    if(typeof google==='undefined' || !google.accounts){ reject(new Error('GOOGLE_SDK_NOT_LOADED')); return; }
    const client = ensureGoogleTokenClient();
    client.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      gDriveAccessToken = resp.access_token;
      resolve(resp.access_token);
    };
    if(gDriveAccessToken && !forceConsent){ resolve(gDriveAccessToken); return; }
    client.requestAccessToken({ prompt: forceConsent ? 'consent' : '' });
  });
}
async function uploadPhotoToDrive(file, labelPrefix){
  let token = await getDriveAccessToken(false);
  const doUpload = async (tk)=>{
    const metadata = { name: `${labelPrefix}_${Date.now()}_${file.name}`, parents: [DRIVE_FOLDER_ID] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
    form.append('file', file);
    return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
      method:'POST', headers:{ Authorization:`Bearer ${tk}` }, body: form,
    });
  };
  let res = await doUpload(token);
  if(res.status===401){ gDriveAccessToken=null; token = await getDriveAccessToken(true); res = await doUpload(token); }
  if(!res.ok) throw new Error('DRIVE_UPLOAD_FAILED');
  const data = await res.json();
  try{
    await fetch(`https://www.googleapis.com/drive/v3/files/${data.id}/permissions`, {
      method:'POST', headers:{ Authorization:`Bearer ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify(DRIVE_SHARE_PERMISSION),
    });
  }catch(e){ /* ไฟล์อัปโหลดสำเร็จแล้ว ต่อให้ตั้งสิทธิ์แชร์ไม่สำเร็จก็ไม่บล็อกการทำงานต่อ */ }
  return data.webViewLink;
}

async function rpc(fnName, params){
  const { data, error } = await sb.rpc(fnName, params);
  if(error){ console.error(fnName, error); throw error; }
  return data;
}
function canWrite(){ return !!session && (session.role==='QC' || session.role==='ADMIN'); }
function isAdmin(){ return !!session && session.role==='ADMIN'; }
function setLoading(msg){ document.getElementById('mainContent').innerHTML = `<div class="empty-state" style="padding:60px 0;">${msg||'กำลังโหลดข้อมูล...'}</div>`; }
function renderErrorState(msg){ document.getElementById('mainContent').innerHTML = `<div class="err-banner">${msg}</div>`; }

/* ================= AUTH ================= */
let pendingSession = null; // เก็บ session ชั่วคราวระหว่างรอบังคับเปลี่ยน PIN
async function doLogin(){
  const code=document.getElementById('loginCode').value.trim();
  const pin=document.getElementById('loginPin').value;
  const errEl=document.getElementById('loginError');
  const btn=document.getElementById('loginBtn');
  errEl.textContent='';
  if(!code || !pin){ errEl.textContent='กรุณากรอกรหัสพนักงานและ PIN'; return; }
  btn.disabled=true; btn.textContent='กำลังเข้าสู่ระบบ...';
  try{
    const data = await rpc('rpc_login', {p_employee_code:code, p_pin:pin});
    const row = data[0];
    const newSession = {token:row.token, employee_id:row.employee_id, full_name:row.full_name, role:row.role};
    if(row.must_change_pin){
      pendingSession = newSession;
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('pinChangeScreen').style.display='flex';
      document.getElementById('loginCode').value=''; document.getElementById('loginPin').value='';
    } else {
      session = newSession;
      sessionStorage.setItem('ptw_session', JSON.stringify(session));
      enterApp();
    }
  }catch(e){
    errEl.textContent='เข้าสู่ระบบไม่สำเร็จ — ตรวจสอบรหัสพนักงาน/PIN อีกครั้ง';
  }finally{
    btn.disabled=false; btn.textContent='เข้าสู่ระบบ';
  }
}
async function submitFirstPinChange(){
  const p1=document.getElementById('newPin1').value, p2=document.getElementById('newPin2').value;
  const errEl=document.getElementById('pinChangeError');
  const btn=document.getElementById('pinChangeBtn');
  errEl.textContent='';
  if(p1.length<4){ errEl.textContent='PIN ต้องมีอย่างน้อย 4 หลัก'; return; }
  if(p1==='12345678'){ errEl.textContent='ห้ามใช้ PIN เริ่มต้น (12345678) กรุณาตั้งค่าใหม่'; return; }
  if(p1!==p2){ errEl.textContent='PIN ทั้งสองช่องไม่ตรงกัน'; return; }
  btn.disabled=true; btn.textContent='กำลังบันทึก...';
  try{
    session = pendingSession; // ใช้ session ชั่วคราวยิง rpc_change_pin ได้ (login สำเร็จแล้ว)
    await rpc('rpc_change_pin', {p_session_token:session.token, p_new_pin:p1});
    sessionStorage.setItem('ptw_session', JSON.stringify(session));
    pendingSession=null;
    document.getElementById('pinChangeScreen').style.display='none';
    document.getElementById('newPin1').value=''; document.getElementById('newPin2').value='';
    enterApp();
  }catch(e){
    errEl.textContent='ตั้ง PIN ใหม่ไม่สำเร็จ กรุณาลองใหม่';
    session=null;
  }finally{
    btn.disabled=false; btn.textContent='ตั้ง PIN ใหม่และเข้าสู่ระบบ';
  }
}
function openChangePinDialog(){
  const p1 = prompt('ตั้ง PIN ใหม่ (อย่างน้อย 4 หลัก):');
  if(p1===null) return;
  if(p1.length<4){ alert('PIN ต้องมีอย่างน้อย 4 หลัก'); return; }
  const p2 = prompt('พิมพ์ PIN ใหม่อีกครั้งเพื่อยืนยัน:');
  if(p2===null) return;
  if(p1!==p2){ alert('PIN ทั้งสองครั้งไม่ตรงกัน'); return; }
  changePin(p1);
}
async function changePin(newPin){
  try{
    await rpc('rpc_change_pin', {p_session_token:session.token, p_new_pin:newPin});
    alert('เปลี่ยน PIN สำเร็จแล้ว');
  }catch(e){ alert('เปลี่ยน PIN ไม่สำเร็จ: '+(e.message||'เกิดข้อผิดพลาด')); }
}
async function doLogout(){
  try{ if(session) await rpc('rpc_logout', {p_session_token:session.token}); }catch(e){}
  session=null; sessionStorage.removeItem('ptw_session');
  document.getElementById('appScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginCode').value=''; document.getElementById('loginPin').value='';
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('roleDisplay').textContent = ROLE_LABEL[session.role] || session.role;
  document.getElementById('userNameDisplay').textContent = session.full_name + ' (' + session.employee_id.slice(0,8) + ')';
  navigateTo('dashboard');
}
window.addEventListener('DOMContentLoaded', ()=>{
  const saved = sessionStorage.getItem('ptw_session');
  if(saved){ try{ session=JSON.parse(saved); enterApp(); }catch(e){} }
});

/* ================= LOT NUMBER HELPERS (client-side preview เท่านั้น เลขจริงคำนวณใน RPC) ================= */
function pad(n,len){return String(n).padStart(len,'0');}
function dayOfYear(d){ const start=new Date(d.getFullYear(),0,0); return Math.floor((d-start)/86400000); }
function buddhistYear(d){ return d.getFullYear()+543; }
function parseDate(dateStr){ return new Date(dateStr+'T00:00:00'); }
function genProdLotCode(dateStr, line){ const d=parseDate(dateStr); return `${buddhistYear(d)}${pad(dayOfYear(d),3)} ${pad(line,2)}`; }
function genSimpleLot(dateStr, line){ const d=parseDate(dateStr); return `${String(d.getFullYear()).slice(-2)}${pad(d.getMonth()+1,2)}${pad(d.getDate(),2)}${pad(line,2)}`; }
function genFGCode(dateStr, line){ const d=parseDate(dateStr); return `${buddhistYear(d)}${pad(dayOfYear(d),3)} ${pad(line,2)}`; }
function genFGSimple(dateStr, line){ return genSimpleLot(dateStr, line); }
function pad2(n){return String(n).padStart(2,'0');}

let docVisibilityCache = null;
async function loadDocVisibility(force){
  if(docVisibilityCache && !force) return docVisibilityCache;
  try{
    const rows = await apiListDocVisibility();
    const m={}; rows.forEach(r=>{ m[r.station+'|'+r.doc_no]=true; });
    docVisibilityCache = m;
  }catch(e){ docVisibilityCache = {}; }
  return docVisibilityCache;
}
function isDocHiddenSync(station, docNo){ return !!(docVisibilityCache && docVisibilityCache[station+'|'+docNo]); }
async function visibleDocsFor(stationKey){
  const all = STATION_DOCS[stationKey]||[];
  if(session.role!=='AUDITOR') return all;
  await loadDocVisibility();
  return all.filter(d=>!isDocHiddenSync(stationKey, d.no));
}

/* ================= เอกสาร Masterlist ต่อ Record — ผูกกับ Supabase doc_evidence ================= */
function isSheetLike(fmt){ const f=(fmt||'').toLowerCase(); return f.includes('google') || f.includes('excel') || f.includes('ecertify'); }
function docMetaLine(d){
  let parts=[];
  if(d.formNo) parts.push(d.formNo);
  parts.push(d.fmt||'ยังไม่ระบุรูปแบบ');
  if(d.erp==='มี') parts.push('<span class="badge badge-pass">ERP</span>');
  if(d.mb==='ใช้') parts.push('<span class="badge badge-ccp">Mass Balance</span>');
  return parts.join(' · ');
}
// ดึงหลักฐานเอกสารทั้งหมดของ record หนึ่งตัว คืนเป็น map: docNo -> evidence row
async function fetchEvidenceMap(recordType, recordId){
  try{
    const rows = await apiListDocEvidence(recordType, recordId);
    const m={}; rows.forEach(r=>{ m[r.doc_no]=r; }); return m;
  }catch(e){ return {}; }
}
function docItemHtml(stationKey, recordType, recordId, d, evidence){
  const link = evidence ? (evidence.link||'') : '';
  const done = !!link;
  const statusBadge = done ? `<span class="badge badge-pass">แนบแล้ว</span>` : `<span class="badge badge-fail">ยังไม่แนบ</span>`;
  let evidenceHtml;
  if(isSheetLike(d.fmt)){
    // เอกสารที่เป็น Google Sheet/Excel/Ecertify เดิมอยู่แล้ว — วางลิงก์เอง ไม่ต้องอัปโหลดรูป
    evidenceHtml = canWrite() ? `<div style="margin-top:6px;display:flex;gap:6px;align-items:center;">
        <input type="text" value="${link}" placeholder="วางลิงก์ Google Sheet / Excel Online ของเอกสารนี้" data-doc-link="${d.no}"
          style="flex:1;padding:6px 8px;font-size:12px;">
        <button class="btn btn-ghost btn-sm" style="white-space:nowrap;" onclick="saveDocLink('${recordType}','${recordId}','${stationKey}','${d.no}')">บันทึกลิงก์</button>
        ${link?`<a href="${link}" target="_blank" class="btn btn-ghost btn-sm" style="white-space:nowrap;">เปิดดู ↗</a>`:''}
      </div>` :
      (link ? `<div style="margin-top:6px;"><a href="${link}" target="_blank" class="btn btn-ghost btn-sm">เปิดดูเอกสาร ↗</a></div>` : `<div style="margin-top:6px;font-size:12px;color:var(--ink-soft);">ยังไม่มีการแนบเอกสาร</div>`);
  } else {
    // เอกสารกระดาษ/ตั๋ว/ผลแลป — ถ่ายรูปแล้วอัปโหลดขึ้น Google Drive อัตโนมัติ ได้ลิงก์กลับมาเก็บใน link
    const uploadBtn = canWrite() ? `<label class="btn btn-ghost btn-sm" style="cursor:pointer;white-space:nowrap;">📷 ถ่าย/แนบรูป → Google Drive
        <input type="file" accept="image/*,application/pdf" capture="environment" style="display:none;" onchange="handleDrivePhoto(this,'${stationKey}','${recordType}','${recordId}','${d.no}')">
      </label>` : '';
    evidenceHtml = `<div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      ${uploadBtn}
      ${link?`<a href="${link}" target="_blank" class="btn btn-ghost btn-sm">เปิดดูเอกสาร ↗</a>`:(canWrite()?'':`<span style="font-size:12px;color:var(--ink-soft);">ยังไม่มีการแนบเอกสาร</span>`)}
    </div>`;
  }
  return `<div class="doc-item" id="docitem-${recordType}-${recordId}-${d.no}">
    <div style="flex:1;">
      <span class="doc-name">#${d.no} ${d.name} ${statusBadge}</span>
      <span class="doc-meta">${docMetaLine(d)}</span>
      ${evidenceHtml}
    </div>
  </div>`;
}
async function handleDrivePhoto(input, stationKey, recordType, recordId, docNo){
  const file = input.files[0];
  if(!file) return;
  const itemEl = document.getElementById(`docitem-${recordType}-${recordId}-${docNo}`);
  const originalHtml = itemEl ? itemEl.innerHTML : '';
  if(itemEl) itemEl.innerHTML = `<div style="padding:10px 4px;font-size:12.5px;color:var(--ink-soft);">กำลังอัปโหลดขึ้น Google Drive...</div>`;
  try{
    const link = await uploadPhotoToDrive(file, `${stationKey}_${docNo}`);
    await apiUpsertDocEvidence(recordType, recordId, stationKey, docNo, link);
    await refreshDocItem(stationKey, recordType, recordId, docNo);
  }catch(e){
    if(itemEl) itemEl.innerHTML = originalHtml;
    if((e && e.message)==='GOOGLE_SDK_NOT_LOADED'){ alert('ยังโหลด Google SDK ไม่เสร็จ กรุณารอสักครู่แล้วลองใหม่'); }
    else { alert('อัปโหลดขึ้น Google Drive ไม่สำเร็จ — ตรวจสอบการเชื่อมต่อและสิทธิ์ Google Drive แล้วลองใหม่'); }
  }
}
async function refreshDocItem(stationKey, recordType, recordId, docNo){
  const evMap = await fetchEvidenceMap(recordType, recordId);
  const doc = (STATION_DOCS[stationKey]||[]).find(x=>x.no===docNo);
  const el = document.getElementById(`docitem-${recordType}-${recordId}-${docNo}`);
  if(el && doc) el.outerHTML = docItemHtml(stationKey, recordType, recordId, doc, evMap[docNo]);
  refreshDocSummary(stationKey, recordType, recordId);
}
async function saveDocLink(recordType, recordId, stationKey, docNo){
  const input = document.querySelector(`#docitem-${recordType}-${recordId}-${docNo} [data-doc-link="${docNo}"]`);
  if(!input) return;
  try{
    await apiUpsertDocEvidence(recordType, recordId, stationKey, docNo, input.value.trim());
    const el = document.getElementById(`docitem-${recordType}-${recordId}-${docNo}`);
    if(el) el.style.outline = '2px solid var(--teal-500)';
    setTimeout(()=>{ if(el) el.style.outline=''; }, 700);
    const summary = document.getElementById(`docsum-${recordType}-${recordId}`);
    if(summary) refreshDocSummary(stationKey, recordType, recordId);
  }catch(e){ alert('บันทึกลิงก์ไม่สำเร็จ'); }
}
async function refreshDocSummary(stationKey, recordType, recordId){
  const docs = await visibleDocsFor(stationKey);
  const evMap = await fetchEvidenceMap(recordType, recordId);
  const done = docs.filter(d=>evMap[d.no] && evMap[d.no].link).length;
  const el = document.getElementById(`docsum-${recordType}-${recordId}`);
  if(el) el.textContent = `เอกสาร Masterlist (${done}/${docs.length} แนบแล้ว)`;
}
async function docDetailsHtml(stationKey, recordType, recordId){
  const docs = await visibleDocsFor(stationKey);
  if(docs.length===0) return `<div class="empty-state" style="padding:14px;">ไม่มีรายการเอกสารของ Station นี้ใน Masterlist${session.role==='AUDITOR'?' (หรือทั้งหมดถูกซ่อนจากมุมมอง Auditor)':''}</div>`;
  const evMap = await fetchEvidenceMap(recordType, recordId);
  const done = docs.filter(d=>evMap[d.no] && evMap[d.no].link).length;
  const items = docs.map(d=>docItemHtml(stationKey, recordType, recordId, d, evMap[d.no])).join('');
  return `<details class="docbox">
    <summary id="docsum-${recordType}-${recordId}">เอกสาร Masterlist (${done}/${docs.length} แนบแล้ว)</summary>
    <div class="doclist">${items}</div>
  </details>`;
}

function updatePlPreview(){

async function createProdLot(){
  const d=document.getElementById('plDate').value, l=document.getElementById('plLine').value;
  if(!d){ alert('กรุณาระบุวันที่'); return; }
  try{ await apiCreateProdLot(d, l); renderProdLotPage(); }
  catch(e){ alert('สร้างไม่สำเร็จ: '+(e.message||'เกิดข้อผิดพลาด')); }
}
async function editProdLot(code, currentDate, currentLine){
  const newDate = prompt('แก้วันที่ผลิต (YYYY-MM-DD):', currentDate);
  if(newDate===null) return;
  const newLine = prompt('แก้ Sub Lot (เช่น 1, 2, 3, 4, 99H):', currentLine);
  if(newLine===null) return;
  if(!newDate || !newLine){ alert('กรุณากรอกให้ครบ'); return; }
  if(!confirm(`ยืนยันแก้ไข Lot ${code} เป็นวันที่ ${newDate} / Sub Lot ${newLine}?\nเลข Lot DLD จะเปลี่ยนตามทันที และข้อมูลทุก Station ที่ผูกกับ Lot นี้จะย้ายตามไปด้วยอัตโนมัติ`)) return;
  try{
    const updated = await apiUpdateProdLot(code, newDate, newLine);
    alert(`แก้ไขสำเร็จ — เลข Lot DLD ใหม่คือ ${updated.code}`);
    renderProdLotPage();
  }catch(e){ alert('แก้ไขไม่สำเร็จ: '+(e.message||'เกิดข้อผิดพลาด')); }
}
async function deleteProdLot(code){
  if(!confirm(`ยืนยันลบ Production Lot ${code}?\nข้อมูลทุก Station ที่บันทึกไว้ของ Lot นี้จะถูกลบไปด้วย การกระทำนี้ย้อนกลับไม่ได้`)) return;
  try{
    await apiDeleteProdLot(code);
    alert('ลบสำเร็จ');
    renderProdLotPage();
  }catch(e){ alert('ลบไม่สำเร็จ: '+(e.message||'เกิดข้อผิดพลาด (อาจมี LOT FG หรือรายการส่งมอบที่อ้างอิง Lot นี้อยู่ ต้องลบสิ่งเหล่านั้นก่อน)')); }
}

function stationFieldsFormHtml(cfg, uid){
  return (cfg.fields||[]).map(f=>{
    if(f.type==='select') return `<div class="field ${f.ccp?'ccp-field':''}"><label>${f.label}${f.ccp?` <span class="badge badge-ccp">${f.ccp}</span>`:''}</label><select data-field="${f.id}" id="fld_${uid}_${f.id}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;

  }).join('');

async function stationAccordionHtml(stationKey, lotCode){
  const cfg=ATTACH_MAP[stationKey];
  let recs=[];
  try{ recs = await apiListAttachRecords(lotCode, stationKey); }catch(e){}
  const existingParts = await Promise.all(recs.map(async r=>{
    const kv=(cfg.fields||[]).map(f=>{
      const v=(r.fields||{})[f.id]||'-';
      if(f.ccp){ const cls=v==='ผ่าน'?'badge-pass':(v==='ไม่ผ่าน'?'badge-fail':'badge-ccp'); return `<span class="badge ${cls}">${f.ccp}: ${v}</span>`; }
      return `<span class="kv"><b>${f.label}:</b> ${v}</span>`;
    }).join(' ');
    const docHtml = await docDetailsHtml(stationKey, 'attach', r.id);
    return `<div class="existing-rec">
      <div class="st">บันทึกเมื่อ ${new Date(r.created_at).toLocaleString('th-TH')}</div>
      <div>${kv}</div>
      <div style="margin-top:8px;">${docHtml}</div>
    </div>`;
  }));
  const existingHtml = existingParts.join('') || `<div class="empty-state" style="padding:10px 4px;">ยังไม่มีข้อมูลของ Lot นี้ใน Station นี้</div>`;
  const uid = stationKey + '_' + lotCode.replace(/\s+/g,'');

  const formHtml = canWrite() ? `
      <div class="inline-form" data-station="${stationKey}" style="margin-top:6px;border-top:1px dashed var(--line);padding-top:12px;">
        <div class="card-title" style="font-size:13px;">+ เพิ่มข้อมูลใหม่ที่ Station นี้ สำหรับ Lot นี้</div>
        <div class="form-grid">${stationFieldsFormHtml(cfg, uid)}</div>
        <button class="btn btn-sm" style="margin-top:10px;" onclick="createAttachRecordInline('${stationKey}','${lotCode}','${uid}')">บันทึกข้อมูล</button>
      </div>` : '';

  return `<details class="station-acc">
    <summary>${cfg.name}${cfg.ccpNote?` <span class="badge badge-ccp">${cfg.ccpNote}</span>`:''}<span class="acc-count">${recs.length} รายการ</span></summary>
    <div class="acc-body">
      ${existingHtml}
      ${formHtml}
    </div>
  </details>`;
}
async function lotStationsAccordionHtml(lotCode){
  const parts = await Promise.all(ATTACH_STATIONS.map(s=>stationAccordionHtml(s.key, lotCode)));
  return parts.join('');
}
async function createAttachRecordInline(stationKey, lotCode, uid){
  const cfg=ATTACH_MAP[stationKey];
  const fields={};
  (cfg.fields||[]).forEach(f=>{
    const el=document.getElementById(`fld_${uid}_${f.id}`);
    if(el) fields[f.id]=el.value;
  });
  try{
    await apiCreateAttachRecord(lotCode, stationKey, fields);
    runTrace();
  }catch(e){ alert('บันทึกไม่สำเร็จ: '+(e.message||'เกิดข้อผิดพลาด')); }
}

function navigateAndTrace(code){ navigateTo('trace'); setTimeout(()=>{ setTraceMode('backward'); setTimeout(()=>{ document.getElementById('traceInput').value=code; runTrace(); }, 50); }, 0); }

function setTraceMode(mode){

async function searchProducts(){

    </div>`).join('');

async function traceFromProductCode(productCode){
  const resultEl = document.getElementById('traceResult');
  resultEl.innerHTML = `<div class="empty-state" style="padding:30px 0;">กำลังค้นหา Lot ที่ผลิต Product นี้...</div>`;
  resultEl.scrollIntoView({behavior:'smooth'});
  let fgs, scRecs, cutRecs, prod;
  try{
    [fgs, scRecs, cutRecs, prod] = await Promise.all([
      apiListFgLots(), apiListAttachRecords(null,'specialcut'), apiListAttachRecords(null,'cutting'), apiListProdLots()
    ]);
  }catch(e){ resultEl.innerHTML = `<div class="err-banner">โหลดข้อมูลไม่สำเร็จ</div>`; return; }

  const matchedFg = fgs.filter(f=>(f.fields||{}).productCode===productCode);
  const matchedSc = scRecs.filter(r=>(r.fields||{}).productCode===productCode);
  const matchedCut = cutRecs.filter(r=>(r.fields||{}).productCode===productCode);

  if(matchedFg.length===0 && matchedSc.length===0 && matchedCut.length===0){
    resultEl.innerHTML = `<div class="note-banner">ยังไม่มี Lot ที่บันทึก Product Code "${productCode}" ไว้ในระบบ (ต้องกรอกที่ Station "เลาะกระดูก" หรือ "ตัดแต่งพิเศษ" หรือตอนสร้าง LOT FG ก่อน)</div>`;
    return;
  }

  let html = `<div class="note-banner">พบ ${matchedFg.length + matchedSc.length + matchedCut.length} Lot ที่ผลิต Product Code "${productCode}" — คลิกรายการเพื่อดู Trace เต็ม</div>`;
  matchedFg.forEach(f=>{
    html += nodeHtmlGeneric(f.code, `LOT FG (IVQF) · ${f.lot_date} Sub Lot ${f.line} · คลิกดู Trace เต็ม`, '', false, true, f.code);
  });
  matchedCut.forEach(r=>{
    const pl = prod.find(p=>p.code===r.prod_lot_code);
    html += nodeHtmlGeneric(r.prod_lot_code, `Production Lot (เลาะกระดูก / CUT-UP) ${pl?`· ${pl.lot_date} Sub Lot ${pl.line}`:''} · คลิกดู Trace เต็ม`, '', false, false, r.prod_lot_code);
  });
  matchedSc.forEach(r=>{
    const pl = prod.find(p=>p.code===r.prod_lot_code);
    html += nodeHtmlGeneric(r.prod_lot_code, `Production Lot (ตัดแต่งพิเศษ) ${pl?`· ${pl.lot_date} Sub Lot ${pl.line}`:''} · คลิกดู Trace เต็ม`, '', false, false, r.prod_lot_code);
  });
  resultEl.innerHTML = html;
}

async function renderTraceForwardMode(){
  const panel = document.getElementById('modePanel');
  panel.innerHTML = `<div class="empty-state" style="padding:30px 0;">กำลังโหลด...</div>`;
  let prod;
  try{ prod = await apiListProdLots(); }catch(e){ panel.innerHTML = `<div class="err-banner">โหลดข้อมูลไม่สำเร็จ</div>`; return; }
  prod = prod.slice().sort((a,b)=> b.created_at.localeCompare(a.created_at));
  const options = prod.map(p=>`<option value="${p.code}">${p.code} — ${p.lot_date} Sub Lot ${p.line}</option>`).join('');
  panel.innerHTML = `
    <div class="card">
      <div class="card-title">เลือก Production Lot (ไก่เป็น) เพื่อดูสินค้าทั้งหมดที่ผลิตได้จาก Lot นี้</div>

        <select id="fwdLotSelect" style="flex:1;">${options || '<option>ยังไม่มี Production Lot ในระบบ</option>'}</select>
        <button class="btn" onclick="runForwardTrace()">ดูผัง Forward</button>
      </div>
    </div>
    <div id="fwdResult"></div>`;
  if(prod.length>0) runForwardTrace();
}
async function runForwardTrace(){
  const code = document.getElementById('fwdLotSelect').value;
  const resultEl = document.getElementById('fwdResult');
  resultEl.innerHTML = `<div class="empty-state" style="padding:30px 0;">กำลังไล่ผัง Forward...</div>`;
  let prod, fgs;
  try{ [prod, fgs] = await Promise.all([apiListProdLots(), apiListFgLots()]); }
  catch(e){ resultEl.innerHTML = `<div class="err-banner">โหลดข้อมูลไม่สำเร็จ</div>`; return; }
  const prodLot = prod.find(p=>p.code===code);
  if(!prodLot){ resultEl.innerHTML = `<div class="note-banner">ไม่พบ Lot นี้</div>`; return; }

  const selfHtml = nodeHtmlGeneric(prodLot.code, `Production Lot (Lot DLD) · Lot day ${prodLot.simple_code} · ${prodLot.lot_date} Sub Lot ${prodLot.line}`, '', true, false);

  let attach=[]; try{ attach = await apiListAttachRecords(code); }catch(e){}
  attach.sort((a,b)=> ATTACH_STATIONS.findIndex(s=>s.key===a.station) - ATTACH_STATIONS.findIndex(s=>s.key===b.station));
  const stationHtml = attach.map(r=>nodeHtmlGeneric(ATTACH_MAP[r.station].name, `${new Date(r.created_at).toLocaleString('th-TH')}`, ccpBadgesForAttach(r), false, false)).join('') || `<div class="empty-state">ยังไม่มีข้อมูล Station ของ Lot นี้</div>`;

  // Main Product: สินค้าที่ผลิตจาก Lot นี้ตรงๆ (Boxing/Cold Storage/ส่งมอบ ที่อ้างอิง Lot นี้)
  let finalRecs=[]; try{ finalRecs = await apiListFinalRecords(null, code); }catch(e){}
  const mainProductHtml = finalRecs.map(r=>nodeHtmlGeneric(FINAL_MAP[r.station].name, `${new Date(r.created_at).toLocaleString('th-TH')}`, ccpBadgesForFinal(r), false, false)).join('') || `<div class="empty-state">ยังไม่มี Main Product ที่ผลิตจาก Lot นี้โดยตรง</div>`;

  // Special Product: LOT FG (IVQF) ที่ใช้ Lot นี้เป็นวัตถุดิบ
  const fgUsing = fgs.filter(f=>(f.rm_sources||[]).includes(code));
  const specialParts = await Promise.all(fgUsing.map(async f=>{
    let n = nodeHtmlGeneric(f.code, `LOT FG (IVQF) · Lot day ${f.simple_code||'-'} · Product Code ${(f.fields||{}).productCode||'-'} · คลิกดู Trace เต็ม`, '', false, true, f.code);
    let finRecs=[]; try{ finRecs = await apiListFinalRecords(null, f.code); }catch(e){}
    n += finRecs.map(r=>nodeHtmlGeneric(FINAL_MAP[r.station].name, `${new Date(r.created_at).toLocaleString('th-TH')}`, ccpBadgesForFinal(r), false, false)).join('');
    return n;
  }));
  const specialProductHtml = specialParts.join('') || `<div class="empty-state">ยังไม่มี Special Product (IVQF) ที่ใช้ Lot นี้เป็นวัตถุดิบ</div>`;

  resultEl.innerHTML = `
    <div style="margin-bottom:16px;">${selfHtml}</div>
    <div class="card">
      <div class="card-title">ขั้นตอนการผลิตของ Lot นี้ (ทุก Station)</div>
      ${stationHtml}
    </div>
    <div class="trace-cols">
      <div class="trace-col"><h4>Main Product (สินค้าหลัก)</h4>${mainProductHtml}</div>
      <div class="trace-col"><h4>Special Product (IVQF)</h4>${specialProductHtml}</div>
    </div>`;
}

function flowDocListHtml(stationKey){

      <div><b>#${d.no}</b> ${d.name}</div>
      <div class="lotsub">${docMetaLine(d)}</div>

function flowBoxHtml(node){
  const docs = STATION_DOCS[node.key]||[];
  const goBtn = FINAL_MAP[node.key] || ATTACH_MAP[node.key]
    ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="goToStationData('${node.key}')">ดูข้อมูลจริงของ Station นี้ →</button>`

        const pairLabel = pl ? ` <span style="opacity:.7">(Lot เอกสารฟอร์มตู้: ${pl.simple_code})</span>` : '';
        return `<div style="margin-top:4px;">
          <button class="btn btn-sm btn-ghost" onclick="navigateAndTrace('${c}')">ดู Lot ${c} โดยตรง ${isFg?'(LOT FG)':'(Lot DLD)'}</button>${pairLabel}
        </div>`;
      }).join('')}</div>
    </div>`).join('');
}

function nodeHtmlGeneric(title, sub, badges, isSelf, isFg, clickCode){
  const clickAttr = clickCode ? ` style="cursor:pointer;" onclick="navigateAndTrace('${clickCode}')"` : '';
  return `<div class="trace-node ${isSelf?'self':''} ${isFg?'fg':''}"${clickAttr}><div class="st">${sub}</div><div class="code">${title}</div><div style="margin-top:4px;">${badges}</div></div>`;
}
function ccpBadgesForAttach(rec){
  const cfg=ATTACH_MAP[rec.station]; if(!cfg||!cfg.fields) return '';
  return cfg.fields.filter(f=>f.ccp).map(f=>{ const v=(rec.fields||{})[f.id]; const cls=v==='ผ่าน'?'badge-pass':(v==='ไม่ผ่าน'?'badge-fail':'badge-ccp'); return `<span class="badge ${cls}">${f.ccp}: ${v||'-'}</span>`; }).join('');
}
function ccpBadgesForFinal(rec){
  const cfg=FINAL_MAP[rec.station]; if(!cfg||!cfg.fields) return '';
  return cfg.fields.filter(f=>f.ccp).map(f=>{ const v=(rec.fields||{})[f.id]; const cls=v==='ผ่าน'?'badge-pass':(v==='ไม่ผ่าน'?'badge-fail':'badge-ccp'); return `<span class="badge ${cls}">${f.ccp}: ${v||'-'}</span>`; }).join('');
}
function upstreamNodesFor(prodLot, farmMap){
  const farm = farmMap.find(f=>f.map_date===prodLot.lot_date && String(f.line)===String(prodLot.line));
  if(!farm) return `<div class="empty-state">ยังไม่มีข้อมูลฟาร์มในตารางอ้างอิงสำหรับวันที่+Sub Lot นี้ — ไปกรอกที่เมนู "ตาราง วันที่+Sub Lot → ฟาร์ม"</div>`;
  let html = nodeHtmlGeneric(`${farm.farm_name} / ${farm.house_name||'-'}`, `ฟาร์มเลี้ยงไก่ (ต้นทางของ Lot นี้) · ${farm.map_date} Sub Lot ${farm.line}`, '', false, false);
  if(farm.feed_lot) html += nodeHtmlGeneric(farm.feed_lot, 'Lot อาหารสัตว์ที่ฟาร์มใช้เลี้ยง (เฟส 2)', '', false, false);
  if(farm.breeder_flock) html += nodeHtmlGeneric(farm.breeder_flock, 'ฝูงพ่อแม่พันธุ์ต้นทางของลูกไก่ (เฟส 2)', '', false, false);
  if(farm.hatchery_batch) html += nodeHtmlGeneric(farm.hatchery_batch, 'ล็อตโรงฟักไข่ที่ผลิตลูกไก่ (เฟส 2)', '', false, false);
  return html;
}

/* ================= Backward เต็มเส้นทางเดียว: ส่งมอบ (Loading) -> ... -> ฟาร์ม/โรงฟัก ================= */
async function backwardChainForCode(code, prod, fgs, farmMapAll){
  let html = '';
  const fgLot = fgs.find(f=>f.code===code);
  const prodLot = prod.find(p=>p.code===code);

  // Boxing / Cold Storage ที่อ้างอิง Lot นี้ (เรียงย้อนกลับ: Cold Storage มาก่อน Boxing เพราะลำดับไปข้างหน้าคือ Boxing -> Cold Storage -> ส่งมอบ)
  let boxCsRecs = [];
  try{ boxCsRecs = (await apiListFinalRecords(null, code)).filter(r=>r.station==='boxing'||r.station==='coldstorage'); }catch(e){}
  const orderMap = {coldstorage:0, boxing:1};
  boxCsRecs.sort((a,b)=> (orderMap[a.station]??9) - (orderMap[b.station]??9));
  boxCsRecs.forEach(r=>{
    html += nodeHtmlGeneric(FINAL_MAP[r.station].name, `${new Date(r.created_at).toLocaleString('th-TH')}`, ccpBadgesForFinal(r), false, false);
  });

  if(fgLot){
    html += nodeHtmlGeneric(fgLot.code, `LOT FG (IVQF) · Lot day ${fgLot.simple_code||'-'} · Product Code ${(fgLot.fields||{}).productCode||'-'}`, '', false, true);
    for(const rc of fgLot.rm_sources||[]){
      html += await backwardChainForCode(rc, prod, fgs, farmMapAll);
    }
  } else if(prodLot){
    html += nodeHtmlGeneric(prodLot.code, `Production Lot (Lot DLD) · Lot day ${prodLot.simple_code}`, '', false, false);
    const reversedStations = ATTACH_STATIONS.slice().reverse(); // Freezing -> ... -> รับไก่ (ย้อนลำดับการผลิตจริง)
    for(const s of reversedStations){
      let recs=[]; try{ recs = await apiListAttachRecords(prodLot.code, s.key); }catch(e){}
      recs.forEach(r=>{ html += nodeHtmlGeneric(s.name, `${new Date(r.created_at).toLocaleString('th-TH')}`, ccpBadgesForAttach(r), false, false); });
    }
    html += upstreamNodesFor(prodLot, farmMapAll);
  } else {
    html += `<div class="empty-state">ไม่พบข้อมูลของ ${code} ในระบบ</div>`;
  }
  return html;
}
async function runFullBackwardChain(shipRecordId){
  const resultEl = document.getElementById('traceResult');
  if(!resultEl) return;
  resultEl.innerHTML = `<div class="empty-state" style="padding:30px 0;">กำลังไล่ผังย้อนกลับ...</div>`;
  resultEl.scrollIntoView({behavior:'smooth'});
  let fin, prod, fgs, farmMapAll;
  try{
    [fin, prod, fgs, farmMapAll] = await Promise.all([apiListFinalRecords('shipment'), apiListProdLots(), apiListFgLots(), apiListFarmMap()]);
  }catch(e){ resultEl.innerHTML = `<div class="err-banner">โหลดข้อมูลไม่สำเร็จ</div>`; return; }
  const ship = fin.find(r=>r.id===shipRecordId);
  if(!ship){ resultEl.innerHTML = `<div class="note-banner">ไม่พบรายการส่งมอบนี้</div>`; return; }

  let chain = nodeHtmlGeneric(
    (ship.fields||{}).customer || 'ลูกค้าไม่ระบุชื่อ',
    `จุดเริ่มต้น: ส่งมอบ / Loading · เลขที่ใบส่งของ ${(ship.fields||{}).doNumber||'-'} · ${new Date(ship.created_at).toLocaleString('th-TH')}`,

  resultEl.innerHTML = `

}

async function ivqfChecklistHtml(fgLot, prod){
  const pcFG = (fgLot.fields||{}).productCode || '-';
  const rmDetails = await Promise.all((fgLot.rm_sources||[]).map(async rc=>{
    const rp = prod.find(p=>p.code===rc);
    let pc = '-';
    try{
      const scRecs = await apiListAttachRecords(rc, 'specialcut');
      const withCode = scRecs.find(r=>(r.fields||{}).productCode);
      if(withCode) pc = withCode.fields.productCode;
    }catch(e){}
    return { code: rc, simple: rp?rp.simple_code:'-', pc };
  }));
  const valFor = (key)=>{
    if(key==='pcFG') return `Product Code: <b>${pcFG}</b>`;
    if(key==='lotNoFG') return `FG Lot No: <b>${fgLot.code}</b>`;
    if(key==='lotDayFG') return `FG Lot day: <b>${fgLot.simple_code||'-'}</b>`;
    if(key==='pcRM') return rmDetails.map(r=>`Product Code: <b>${r.pc}</b>`).join('<br>');
    if(key==='lotNoRM') return rmDetails.map(r=>`RM Lot No: <b>${r.code}</b>`).join('<br>');
    if(key==='lotDayRM') return rmDetails.map(r=>`RM Lot day: <b>${r.simple}</b>`).join('<br>');
    return '-';
  };
  const rows = IVQF_CHECKLIST_ITEMS.map(item=>`<tr><td>${item.ref}</td><td>${item.needs.map(valFor).join('<br>')}</td></tr>`).join('');
  return `<table><thead><tr><th>รายงานที่ต้องตรวจ</th><th>ข้อมูลที่ต้องชนต่อ</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ================= QC Supervisor: สถานะความครบถ้วนรายวัน ================= */
async function aggregatedDocStatus(stationKey, lotCode, allAttachRecs){
  const total=(STATION_DOCS[stationKey]||[]).length;
  const recs=allAttachRecs.filter(r=>r.prod_lot_code===lotCode && r.station===stationKey);
  if(recs.length===0) return {hasData:false, done:0, total};
  const evMaps = await Promise.all(recs.map(r=>fetchEvidenceMap('attach', r.id)));
  const doneSet=new Set();
  (STATION_DOCS[stationKey]||[]).forEach(d=>{
    if(evMaps.some(m=>m[d.no] && m[d.no].link)) doneSet.add(d.no);
  });
  return {hasData:true, done:doneSet.size, total};
}
function statusCellHtml(s){
  if(!s.hasData) return `<td><span class="badge badge-fail">✗ ไม่มีข้อมูล</span></td>`;
  if(s.total>0 && s.done<s.total) return `<td><span class="badge badge-ccp">⚠ เอกสาร ${s.done}/${s.total}</span></td>`;
  return `<td><span class="badge badge-pass">✓ ครบ ${s.total?`(${s.done}/${s.total})`:''}</span></td>`;
}

async function auditorStats(){
  const [prod, recs, fin, fg] = await Promise.all([apiListProdLots(), apiListAttachRecords(), apiListFinalRecords(), apiListFgLots()]);
  let ccpFail=0, ccpTotal=0;
  recs.forEach(r=>{ const cfg=ATTACH_MAP[r.station]; (cfg.fields||[]).forEach(f=>{ if(f.ccp){ ccpTotal++; if((r.fields||{})[f.id]==='ไม่ผ่าน') ccpFail++; } }); });
  fin.forEach(r=>{ const cfg=FINAL_MAP[r.station]; (cfg.fields||[]).forEach(f=>{ if(f.ccp){ ccpTotal++; if((r.fields||{})[f.id]==='ไม่ผ่าน') ccpFail++; } }); });

  const allRecs = [...recs.map(r=>({type:'attach', id:r.id, station:r.station})), ...fin.map(r=>({type:'final', id:r.id, station:r.station}))];
  let totalDocSlots=0, doneDocSlots=0;
  await Promise.all(allRecs.map(async r=>{
    const docs = await visibleDocsFor(r.station);
    totalDocSlots += docs.length;
    const evMap = await fetchEvidenceMap(r.type, r.id);
    doneDocSlots += docs.filter(d=>evMap[d.no] && evMap[d.no].link).length;
  }));

  return {
    totalLots: prod.length,
    docPct: totalDocSlots? Math.round(doneDocSlots/totalDocSlots*100):0,
    doneDocSlots, totalDocSlots, ccpFail, ccpTotal,
    totalFG: fg.length,
    totalShipments: fin.filter(r=>r.station==='shipment').length,
  };
}

  let s, prod, fgs;
  try{ [s, prod, fgs] = await Promise.all([auditorStats(), apiListProdLots(), apiListFgLots()]); }
  catch(e){ renderErrorState('โหลดข้อมูลไม่สำเร็จ'); return; }
  const options = prod.map(p=>`<option value="${p.code}">`).join('') + prod.map(p=>`<option value="${p.simple_code}">`).join('') + fgs.map(f=>`<option value="${f.code}">`).join('');
  document.getElementById('mainContent').innerHTML=`
    <div class="page-eyebrow">Auditor View · Read-only</div>
    <div class="page-title">มุมมองสำหรับ Auditor</div>
    <div class="page-desc">ภาพรวมระบบสำหรับการตรวจสอบ — ไม่มีปุ่มแก้ไข/เพิ่มข้อมูลในมุมมองนี้ ใช้สำหรับค้นหาและดูเท่านั้น</div>
    <div class="grid-cards" style="margin-bottom:22px;">
      <div class="stat-card" style="cursor:default;"><div class="num">${s.totalLots}</div><div class="lbl">Production Lot ทั้งหมดในระบบ</div></div>
      <div class="stat-card" style="cursor:default;"><div class="num">${s.docPct}%</div><div class="lbl">เอกสารแนบครบ (${s.doneDocSlots}/${s.totalDocSlots} รายการ)</div></div>
      <div class="stat-card" style="cursor:default;"><div class="num">${s.ccpFail}</div><div class="lbl">ผล CCP "ไม่ผ่าน" (จาก ${s.ccpTotal} รายการที่บันทึก)</div>
        <span class="tag" style="background:${s.ccpFail>0?'var(--red-100)':'var(--green-100)'};color:${s.ccpFail>0?'var(--red-600)':'var(--green-700)'};">${s.ccpFail>0?'ต้องตรวจสอบเพิ่ม':'ปกติทั้งหมด'}</span>
      </div>
      <div class="stat-card" style="cursor:default;"><div class="num">${s.totalShipments}</div><div class="lbl">รายการส่งมอบลูกค้า</div></div>
    </div>
    <div class="card">
      <div class="card-title">ค้นหา Lot / ลูกค้า เพื่อดูสายการทวนสอบย้อนกลับเต็มรูปแบบ</div>
      <div class="trace-search">
        <input type="text" id="auditorTraceInput" list="auditorLotList" placeholder="เช่น 2569227 01, 26081501, ชื่อลูกค้า หรือเลขที่ใบส่งของ">
        <datalist id="auditorLotList">${options}</datalist>
        <button class="btn" onclick="auditorSearch()">ค้นหา</button>
      </div>
    </div>
  `;
}
async function auditorSearch(){
  const q=document.getElementById('auditorTraceInput').value.trim();
  let prod=[], fgs=[];
  try{ [prod, fgs] = await Promise.all([apiListProdLots(), apiListFgLots()]); }catch(e){}
  const prodLot = prod.find(p=>p.code===q) || prod.find(p=>p.simple_code===q);
  const fgLot = fgs.find(f=>f.code===q);
  if(prodLot || fgLot){ navigateAndTrace(prodLot?prodLot.code:fgLot.code); return; }
  navigateTo('trace');
  setTimeout(()=>{ document.getElementById('shipSearch').value=q; searchShipments(); }, 0);
}

/* ================= Admin: Employees ================= */
async function renderEmployeesPage(){
  setLoading();
  let list;
  try{ list = await apiListEmployees(); }catch(e){ renderErrorState('ไม่สามารถโหลดรายชื่อผู้ใช้งานได้'); return; }
  const rows = list.map(e=>`<tr>
    <td>${e.employee_code}</td><td>${e.full_name}</td>
    <td><span class="badge badge-ccp">${ROLE_LABEL[e.role]||e.role}</span></td>
    <td>${e.active?'<span class="badge badge-pass">ใช้งานอยู่</span>':'<span class="badge badge-fail">ปิดใช้งาน</span>'}</td>
    <td>${new Date(e.created_at).toLocaleString('th-TH')}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="toggleEmployeeActive('${e.id}', ${!e.active})">${e.active?'ปิดใช้งาน':'เปิดใช้งาน'}</button></td>
  </tr>`).join('') || `<tr><td colspan="6"><div class="empty-state">ยังไม่มีผู้ใช้งาน</div></td></tr>`;
  document.getElementById('mainContent').innerHTML=`
    <div class="page-eyebrow">Admin</div>
    <div class="page-title">จัดการผู้ใช้งาน</div>
    <div class="page-desc">สร้าง User ใหม่และกำหนดบทบาท — เมนูนี้เห็นเฉพาะ Admin เท่านั้น</div>
    <div class="card">
      <div class="card-title">สร้างผู้ใช้งานใหม่</div>
      <div class="note-banner" style="margin-bottom:14px;">PIN เริ่มต้นของผู้ใช้งานใหม่ทุกคนคือ <b>12345678</b> — ระบบจะบังคับให้ตั้ง PIN ใหม่ทันทีที่ Login ครั้งแรก</div>
      <div class="form-grid">
        <div class="field"><label>รหัสพนักงาน</label><input type="text" id="empCode" placeholder="เช่น QC1032"></div>
        <div class="field"><label>ชื่อ-นามสกุล</label><input type="text" id="empName"></div>
        <div class="field full"><label>บทบาท</label><select id="empRole">
          <option value="QC">QC / PRD (บันทึกข้อมูล)</option>
          <option value="QA">QA / Manager (อ่านอย่างเดียว)</option>
          <option value="AUDITOR">Auditor (อ่านอย่างเดียว)</option>
          <option value="ADMIN">Admin (ทำได้ทุกอย่าง)</option>
        </select></div>
      </div>
      <button class="btn" style="margin-top:10px;" onclick="createEmployee()">สร้างผู้ใช้งาน</button>
      <div id="empCreateMsg" style="margin-top:10px;font-size:13px;"></div>
    </div>
    <div class="card">
      <div class="card-title">ผู้ใช้งานทั้งหมด (${list.length})</div>
      <table><thead><tr><th>รหัสพนักงาน</th><th>ชื่อ</th><th>บทบาท</th><th>สถานะ</th><th>สร้างเมื่อ</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>
  `;
}
async function createEmployee(){
  const code=document.getElementById('empCode').value.trim();
  const name=document.getElementById('empName').value.trim();
  const role=document.getElementById('empRole').value;
  const msg=document.getElementById('empCreateMsg');
  if(!code||!name){ msg.textContent='กรุณากรอกให้ครบ'; msg.style.color='var(--red-600)'; return; }
  try{
    await apiCreateEmployee(code,name,role);
    msg.textContent='สร้างผู้ใช้งานสำเร็จ — PIN เริ่มต้นคือ 12345678'; msg.style.color='var(--green-700)';
    renderEmployeesPage();
  }catch(e){ msg.textContent='สร้างไม่สำเร็จ: '+(e.message||'เกิดข้อผิดพลาด (อาจมีรหัสพนักงานนี้อยู่แล้ว)'); msg.style.color='var(--red-600)'; }
}
async function toggleEmployeeActive(id, active){
  try{ await apiSetEmployeeActive(id, active); renderEmployeesPage(); }catch(e){ alert('ทำรายการไม่สำเร็จ'); }
}

/* ================= Admin: ซ่อนเอกสารจากมุมมอง Auditor ================= */
const ALL_STATION_KEYS_FOR_DOCS = ['farm', ...ATTACH_STATIONS.map(s=>s.key), ...FINAL_STATIONS.map(s=>s.key)];
const STATION_LABELS_FOR_DOCS = Object.assign(
  {farm:'ฟาร์มเลี้ยงไก่ (เฟส 2)'},
  Object.fromEntries(ATTACH_STATIONS.map(s=>[s.key,s.name])),
  Object.fromEntries(FINAL_STATIONS.map(s=>[s.key,s.name]))
);
async function renderDocVisibilityPage(){
  setLoading();
  let hiddenMap;
  try{ hiddenMap = await loadDocVisibility(true); }catch(e){ renderErrorState('โหลดข้อมูลไม่สำเร็จ'); return; }

  const sections = ALL_STATION_KEYS_FOR_DOCS.map(stationKey=>{
    const docs = STATION_DOCS[stationKey]||[];
    if(docs.length===0) return '';
    const hiddenCount = docs.filter(d=>hiddenMap[stationKey+'|'+d.no]).length;
    const rows = docs.map(d=>{
      const hidden = !!hiddenMap[stationKey+'|'+d.no];
      return `<label class="doc-item" style="cursor:pointer;">
        <input type="checkbox" ${hidden?'checked':''} onchange="toggleDocVisibility('${stationKey}','${d.no}',this.checked)">
        <span><span class="doc-name">#${d.no} ${d.name}</span><span class="doc-meta">${docMetaLine(d)}</span></span>
      </label>`;
    }).join('');
    return `<details class="station-acc">
      <summary>${STATION_LABELS_FOR_DOCS[stationKey]||stationKey}<span class="acc-count">${hiddenCount>0?`${hiddenCount} ซ่อนอยู่ / `:''}${docs.length} เอกสาร</span></summary>
      <div class="acc-body"><div class="doclist" style="max-height:none;">${rows}</div></div>
    </details>`;
  }).join('');

  document.getElementById('mainContent').innerHTML = `
    <div class="page-eyebrow">Admin</div>
    <div class="page-title">ซ่อนเอกสารจากมุมมอง Auditor</div>
    <div class="page-desc">ติ๊กเอกสารที่ไม่ต้องการให้ Auditor เห็น (เช่น เอกสารภายในที่ไม่เกี่ยวกับการตรวจสอบภายนอก) — <b>ไม่กระทบ QC/QA</b> ยังเห็นและกรอกเอกสารครบทุกรายการเหมือนเดิม กระทบเฉพาะสิ่งที่ผู้ใช้บทบาท Auditor มองเห็นเท่านั้น</div>
    ${sections}
  `;
}
async function toggleDocVisibility(stationKey, docNo, hidden){
  try{
    await apiSetDocVisibility(stationKey, docNo, hidden);
    docVisibilityCache = null;
  }catch(e){ alert('บันทึกไม่สำเร็จ: '+(e.message||'เกิดข้อผิดพลาด')); }
}
</script>
